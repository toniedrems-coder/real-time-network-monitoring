name: Backend

on:
  push:
    paths:
      - "backend/**"
      - "backend.Tests/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "backend.Tests/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
      - name: Restore dependencies
        run: dotnet restore ../backend.Tests/backend.Tests.csproj
      - name: Build
        run: dotnet build ../backend.Tests/backend.Tests.csproj --no-restore --configuration Release
      - name: Test
        run: dotnet test ../backend.Tests/backend.Tests.csproj --no-build --configuration Release
