services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: network-monitor-kafka

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: network-monitor-kafka-cluster

    ports:
      - "127.0.0.1:29092:29092"

  postgres:
    image: postgres:17
    container_name: network-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: network_monitor
      POSTGRES_USER: network_monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - network-monitor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U network_monitor -d network_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ForwardedHeaders__KnownProxies__0: 172.30.0.10
      ConnectionStrings__MonitoringDatabase: Host=postgres;Port=5432;Database=network_monitor;Username=network_monitor;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      Authentication__Authority: ${AUTHENTICATION_AUTHORITY:?Set AUTHENTICATION_AUTHORITY}
      Authentication__Audience: ${AUTHENTICATION_AUDIENCE:?Set AUTHENTICATION_AUDIENCE}
      Authentication__SwaggerTokenUrl: ${AUTHENTICATION_SWAGGER_TOKEN_URL:?Set AUTHENTICATION_SWAGGER_TOKEN_URL}
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN, for example https://monitor.example.com}
      Kafka__BootstrapServers: kafka:9092
      OpenTelemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      Kubernetes__ApiServer: ${KUBERNETES_API_SERVER:-}
      Kubernetes__BearerToken: ${KUBERNETES_BEARER_TOKEN:-}
      Kubernetes__MaximumReplicas: ${KUBERNETES_MAXIMUM_REPLICAS:-10}
      Logging__LokiBaseUrl: ${LOKI_BASE_URL:-}
      Logging__LokiBearerToken: ${LOKI_BEARER_TOKEN:-}
      Notifications__WebhookUrl: ${NOTIFICATIONS_WEBHOOK_URL:-}
      Notifications__WebhookSigningSecret: ${NOTIFICATIONS_WEBHOOK_SIGNING_SECRET:-}
      Notifications__Email__SmtpHost: ${NOTIFICATIONS_EMAIL_SMTP_HOST:-}
      Notifications__Email__SmtpPort: ${NOTIFICATIONS_EMAIL_SMTP_PORT:-587}
      Notifications__Email__UseTls: ${NOTIFICATIONS_EMAIL_USE_TLS:-true}
      Notifications__Email__UserName: ${NOTIFICATIONS_EMAIL_USERNAME:-}
      Notifications__Email__Password: ${NOTIFICATIONS_EMAIL_PASSWORD:-}
      Notifications__Email__From: ${NOTIFICATIONS_EMAIL_FROM:-}
      Notifications__Email__To: ${NOTIFICATIONS_EMAIL_TO:-}
      Notifications__Sms__AccountSid: ${NOTIFICATIONS_SMS_ACCOUNT_SID:-}
      Notifications__Sms__AuthToken: ${NOTIFICATIONS_SMS_AUTH_TOKEN:-}
      Notifications__Sms__From: ${NOTIFICATIONS_SMS_FROM:-}
      Notifications__Sms__To: ${NOTIFICATIONS_SMS_TO:-}
      Docker__ApiBaseUrl: ${DOCKER_API_BASE_URL:-}
      Docker__BearerToken: ${DOCKER_API_BEARER_TOKEN:-}
    networks:
      default:
        ipv4_address: 172.30.0.20

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks:
      default:
        ipv4_address: 172.30.0.10

volumes:
  network-monitor-postgres-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
    